<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contenedor de Trabajos Prácticos Don Bosco 2026</title>
    <meta name="description" content="Catálogo y vidriera digital de proyectos y trabajos prácticos de Habilidades Digitales + IA 2026 de la Escuela de Formación Profesional Don Bosco." />
    <meta property="og:title" content="Contenedor de Trabajos Prácticos Don Bosco 2026" />
    <meta property="og:description" content="Catálogo y vidriera digital de proyectos y trabajos prácticos de Habilidades Digitales + IA 2026 de la Escuela de Formación Profesional Don Bosco." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('donbosco_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
